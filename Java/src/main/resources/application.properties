spring.application.name=gateway
# application.properties : 스프링 설정을 적는 곳 (# 은 주석)

# 1. 내장 서버 포트 번호 (React 가 이 포트로 요청을 보냄)
server.port=${PORT:8080}

# 2. AI 서버(FastAPI) 주소
#    PredictionService / RecommendationService 의 @Value("${ai.server.url}") 로 주입된다
ai.server.url=${AI_SERVER_URL:http://127.0.0.1:8000}
spring.codec.max-in-memory-size=2MB
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
